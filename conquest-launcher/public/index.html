<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://i.ytimg.com; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>CoA Custom Races</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="builder/builder.css">
</head>
<body>
  <div class="app-shell">
    <div class="world-background" aria-hidden="true"></div>
    <header>
      <div class="titlebar">
        <span class="app-caption"><img class="tiny-crest" src="assets/coa-custom-emblem.png" alt=""> CoA Custom Races</span>
        <div class="titlebar-right"><span class="preview-label"></span><button data-action="minimize" class="window-control" aria-label="Minimize">−</button><button data-action="maximize" class="window-control" aria-label="Maximize">□</button><button data-action="close" class="window-control close-window" aria-label="Close">×</button></div>
      </div>
      <div class="utilitybar">
        <button class="realm-select" data-action="realms"><span class="realm-icon realm-icon-image"><img src="assets/coa-custom-emblem.png" alt=""></span><span>CoA Custom Races</span><span class="chevron">⌄</span></button>
        <div class="utility-right"><button data-action="notifications" class="icon-button" aria-label="Notifications"><i data-icon="bell"></i><span class="notification-dot" hidden></span></button><button data-action="settings" class="icon-button" aria-label="Settings"><i data-icon="settings"></i></button><button data-action="language" class="icon-button language-button" aria-label="Language" title="Language"><i data-icon="globe"></i></button></div>
      </div>
      <nav class="main-nav" aria-label="Main navigation">
        <div class="nav-group nav-left"><button class="nav-link active" data-page="home"><i data-icon="home"></i>Home</button><button class="nav-link" data-page="updates"><i data-icon="refresh"></i>Updates</button><button class="nav-link" data-page="server"><i data-icon="database"></i>Server</button><button class="nav-link" data-page="races"><i data-icon="user"></i>Races</button><button class="nav-link" data-page="builder"><i data-icon="builder"></i>Builder</button></div>
        <button class="brand" data-page="home" aria-label="CoA Custom Races home"><img class="brand-logo" src="assets/coa-custom-logo.png" alt="" width="900" height="636"></button>
        <div class="nav-group nav-right"><button class="nav-link" data-page="bots"><i data-icon="shield"></i>Bots</button><button class="nav-link" data-page="addons"><i data-icon="addons"></i>Addons</button><button class="nav-link" data-page="database"><i data-icon="database"></i>Database</button><button class="nav-link" data-page="bugtracker"><i data-icon="bug"></i>Bugtracker</button></div>
      </nav>
    </header>
    <main id="main-content" tabindex="-1"></main>
    <footer><div><span class="status-dot"></span><span id="connection-status">Local server mode</span><span class="footer-separator">/</span><span id="footer-client">No client selected</span></div><div><button data-action="coa-duff" title="Originally developed by Duff (Duff-SPP) as Conquest Launcher">Launcher by Duff (Duff-SPP) <i data-icon="external"></i></button><span class="footer-separator">/</span><button data-action="coa-coffee">Buy me a coffee <i data-icon="external"></i></button><span class="footer-separator">/</span><span id="version">v0.1.0</span></div></footer>
  </div>
  <div id="popover-root"></div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="builder/data/coa-data.js"></script>
  <script src="i18n.js"></script>
  <script src="locales.js"></script>
  <script src="builder/builder.js"></script>
  <script src="app.js"></script>
  <script src="updates.js"></script>
  <script src="language-ui.js"></script>
  <script src="auth-gate.js"></script>
</body>
</html>
